<style>
:root{--board:#1d3b36;--board2:#15302c;--chalk:#f5f3ea;--yel:#f4c542;--paper:#eef2ef;--card:#fff;--ink:#14201e;--mu:#5d6d69;--line:#cfd9d4;--ok:#2e9e6b;--bad:#d6483f;--edge:#3b5c55}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Figtree,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
body[data-m=stage]{background:var(--board2);color:var(--chalk)}

h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:0 0 8px}h2{margin:0 0 6px;font-size:22px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--board);color:var(--chalk)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo i{width:28px;height:21px;border:2px solid var(--yel);border-radius:3px;position:relative}
.logo i:after{content:"";position:absolute;left:4px;right:4px;top:5px;height:2px;background:var(--yel);box-shadow:0 5px 0 var(--yel)}
main{max-width:980px;margin:24px auto;padding:0 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;margin:4px 0}
input[type=radio],input[type=checkbox]{width:auto;margin:0;accent-color:var(--board)}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button{background:var(--board);color:var(--chalk);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:2px;transition:transform .1s,background .15s}
button:hover{background:#2a554d}button:active{transform:translateY(1px)}
.pri{background:var(--yel);color:#2b2200}.pri:hover{background:#ffd75e}
button.g{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.85}button.g:hover{background:rgba(127,127,127,.14)}
button.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}button.d:hover{background:rgba(214,72,63,.1)}
button:disabled{opacity:.45;cursor:not-allowed}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.r>*{flex:0 0 auto}.r .f{flex:1;min-width:140px}
.mu{color:var(--mu);font-size:14px}body[data-m=stage] .mu{color:#b8c9c3}
label.t{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;margin:3px 6px 3px 0;font-weight:600;font-size:14px}
label.t:has(input:checked){background:var(--board);color:var(--chalk);border-color:var(--board)}
body[data-m=stage] label.t{border-color:var(--edge)}
body[data-m=stage] label.t:has(input:checked){background:var(--yel);color:#2b2200;border-color:var(--yel)}
body[data-m=stage] input{background:var(--board2);color:var(--chalk);border-color:var(--edge)}
.hero{background:var(--board);color:var(--chalk);border-radius:14px;padding:clamp(22px,5vw,44px);margin-bottom:16px;box-shadow:inset 0 0 0 6px var(--board),inset 0 0 0 8px var(--edge)}
.hero .mu{color:#b8c9c3;margin:0 0 18px}
.hero input{background:var(--board2);color:var(--chalk);border-color:var(--edge)}
.hero input::placeholder{color:#7f9a93}
.codein{font:800 clamp(30px,7vw,46px) 'Bricolage Grotesque',sans-serif;letter-spacing:.3em;text-align:center;text-transform:uppercase;color:var(--yel)!important;border:2px dashed #5b7c75!important;max-width:300px}
.err{min-height:22px;font-size:14px;color:#ffb4ab}.tch .err{color:var(--bad)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.bar .f{flex:1}
.join{flex:1;text-align:center;color:#b8c9c3}.code{font-size:38px;font-weight:800;color:var(--yel);letter-spacing:.2em;margin-left:10px}
.pts{background:var(--yel);color:#2b2200;font-weight:800;padding:4px 12px;border-radius:999px}
.prog{height:5px;background:#2a4a44;border-radius:3px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--yel);transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.board{background:var(--board);color:var(--chalk);border:1px solid var(--edge);border-radius:14px;padding:clamp(18px,4vw,36px);min-height:240px;margin-bottom:12px}
.big h2{font-size:clamp(26px,4.5vw,40px);line-height:1.15;margin:0 0 14px;font-weight:800}
.big p{font-size:clamp(18px,2.4vw,23px);white-space:pre-wrap;max-width:62ch;margin:0}
.big p.mu{font-size:14px;margin-top:10px}.res{font-weight:600;margin-top:12px!important}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#244a43;color:var(--chalk);border:2px solid transparent;padding:12px 14px;margin:8px 0;font-size:18px;border-radius:10px;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){background:#2d5a52}
.ab{flex:0 0 32px;height:32px;border-radius:6px;background:var(--chalk);color:var(--board);display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--yel)}.opt.ok{background:#1f6b4b;border-color:#5fd39c}.opt.no{background:#7a2e2a;border-color:#ff8a80}
.opt:disabled{cursor:default;opacity:1}.opt:disabled:not(.ok):not(.no):not(.sel){opacity:.55}
.lb{background:var(--board);color:var(--chalk);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.lb>b{display:block;margin-bottom:6px}
.lb .rk{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2a4a44}
.lb .rk:first-of-type{color:var(--yel);font-weight:800;font-size:18px}
.sg{border-left:4px solid var(--yel);padding:2px 10px;margin:8px 0}
.c.sg{border-left-color:var(--board)}
.item{border-left:5px solid var(--board)}.item.q{border-left-color:var(--yel)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--board);border-radius:8px;overflow:hidden}.seg button{margin:0;border-radius:0;background:transparent;color:var(--ink)}.seg button.on{background:var(--board);color:var(--chalk)}
.msgs{max-height:360px;overflow:auto;padding:4px 2px;margin-bottom:8px}.m{padding:9px 12px;border-radius:10px;margin:6px 0;max-width:90%;white-space:pre-wrap}
.m.u{background:var(--board);color:var(--chalk);margin-left:auto}.m.a{background:var(--paper);border:1px solid var(--line)}.m ol{margin:4px 0 8px 18px;padding:0}.m.a div{margin-top:8px}
select{padding:10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;max-width:100%}
.fld{display:block;margin:12px 0;font-weight:600;font-size:14px}details.c summary{cursor:pointer}
body.present header,body.present .bar,body.present .ctl{display:none}
body.present,body.present *{cursor:none!important}
.pcode{display:none}body.present .pcode{display:block;position:fixed;right:16px;bottom:12px;color:#b8c9c3;font-size:14px}.pcode b{color:var(--yel);letter-spacing:.15em;margin-left:6px}
.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;transition:opacity .6s;z-index:9}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.tr .f{flex:1;min-width:140px}.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><b class="logo"><i></i>Lumo</b><span id="hr"></span></header><main id="app"></main>
<script>
const PROXY='https://groq-proxy.a765browne.workers.dev/',MODEL='openai/gpt-oss-120b',RELAY='';/* optional: URL of your Lumo relay Worker, see README */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg={ai:true},fs=null,sel='/memory.md',user=ls('lc_session',null),lessons=[],L=null,peer=null,conns={},players={},H=null,sugs=[],aiSugs=[],conn=null;
const app=$('#app');
async function hash(p,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let st;function save(){if(scope?.t==='srv'||scope?.t==='smgr'){clearTimeout(st);const sc=scope,l0=lessons;st=setTimeout(()=>api('PUT',sc.t==='smgr'?'/api/admin/lessons?u='+encodeURIComponent(sc.u):'/api/lessons',{lessons:l0}).catch(e=>hint('Could not save: '+e.message)),500);return}if(scope?.t==='remote'){clearTimeout(st);st=setTimeout(()=>rc&&rc.send({t:'save',lessons}),400)}else if(scope?.t==='mgr'){SC.lessons[scope.u]=lessons;saveSC()}else sv('lc_l_'+user,lessons)}
function hdr(){document.body.dataset.m='app';$('#hr').innerHTML=user?`${esc(user)} <button class="g" onclick="settings()">Settings</button><button class="g" onclick="logout()">Log out</button>`:''}
function logout(){stopHost();srvClear();stopHub();closeRemote();scope=null;SC=null;role=null;user=null;localStorage.removeItem('lc_session');home()}
function home(){if(WORKER){const s=ls('lc_srv',null);if(s&&s.tok){SRV=s;user=s.u;scope={t:'srv'};hdr();app.innerHTML='<div class="c mu">Loading…</div>';api('GET','/api/me').then(j=>{srvSet(j);dash()}).catch(()=>{if(!SRV)return;srvClear();user=null;scope=null;hdr();authView()});return}user=null;scope=null;hdr();authView();return}hdr();user?dash():authView()}
/* ---------- auth + join ---------- */
function authView(){if(WORKER)return srvAuthView();app.innerHTML=`<section class="hero"><h1>Join your class</h1><p class="mu">Enter the code shown on your teacher's screen.</p><div class="r"><input class="codein" id="jc" placeholder="CODE" maxlength="5" aria-label="Lesson code"><input class="f" id="jn" placeholder="Your name" aria-label="Your name"><button class="pri" onclick="join()">Join lesson</button></div><div class="err" id="je"></div><button class="g" onclick="connCheck()">Test my connection</button><div class="mu" id="cc" style="margin-top:8px"></div></section>
<section class="c tch"><h2>Teachers</h2><p class="mu">Log in to create and host lessons. Accounts are stored in this browser.</p>
<div class="r"><input class="f" id="au" placeholder="Username" aria-label="Username"><input class="f" id="ap" type="password" placeholder="Password (6+ characters)" aria-label="Password"></div><button class="pri" onclick="auth(0)">Log in</button><button class="g" onclick="auth(1)">Create account</button><div class="err" id="ae"></div></section>
<details class="c"><summary><b>Join a school as a teacher</b></summary><p class="mu">Your principal manages your account, and your lessons are stored on the school's computer.</p>
${DIR?`<div class="r"><input class="f" id="sq" placeholder="Search schools by name" aria-label="Search schools"><button onclick="schoolSearch()">Search</button></div><div id="sres"></div>`:'<p class="mu">School search is not set up on this site. Enter the code from your principal.</p>'}
<div class="r"><input class="f" id="sc" placeholder="School code" maxlength="6" aria-label="School code" style="text-transform:uppercase"><button class="pri" onclick="schoolFind($('#sc').value)">Find school</button></div><div class="err" id="sge" style="color:var(--bad)"></div></details>
<details class="c"><summary><b>Principals: create a school</b></summary><p class="mu">You manage teacher accounts and lessons. Lessons are stored and hosted on this computer, so keep Lumo open while teachers are working.</p>
<div class="r"><input class="f" id="psn" placeholder="School name" aria-label="School name"><input class="f" id="psc" placeholder="City (optional)" aria-label="City"></div><div class="r"><input class="f" id="pu" placeholder="Your username" aria-label="Principal username"><input class="f" id="pp" type="password" placeholder="Password (6+ characters)" aria-label="Password"></div>
<button class="pri" onclick="pauth()">Create school</button><div class="err" id="pe" style="color:var(--bad)"></div></details>`;const jp=new URLSearchParams(location.search).get('join');if(jp&&$('#jc'))$('#jc').value=jp.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)}
async function auth(reg){const u=$('#au').value.trim(),p=$('#ap').value,us=ls('lc_users',{}),e=$('#ae');
if(!u||p.length<6)return e.textContent='Enter a username and a 6+ character password.';
if(reg){if(us[u])return e.textContent='Username taken.';const s=crypto.randomUUID();us[u]={s,h:await hash(p,s)};sv('lc_users',us)}
else if(!us[u]||us[u].h!==await hash(p,us[u].s))return e.textContent='Wrong username or password.';
user=u;sv('lc_session',u);dash()}
/* ---------- dashboard ---------- */
function dash(){hdr();loadU();if(!scope)lessons=ls('lc_l_'+user,[]);
app.innerHTML=`${banner()}<div class="c"><div class="r"><h2 class="f">Your lessons</h2><button class="pri" onclick="newL()">+ New lesson</button></div>${lessons.map((l,i)=>`<div class="r c"><div class="f"><b>${esc(l.title)}</b><div class="mu">${l.items.length} items</div></div><button onclick="edit(${i})">Edit</button><button class="pri" onclick="host(${i})">Host</button><button class="d" onclick="delL(${i})">Delete</button></div>`).join('')||'<p class="mu">No lessons yet. Create one by hand or let AI draft it.</p>'}</div>`}
function newL(){lessons.push({title:'Untitled lesson',lb:false,quiz:true,items:[]});save();edit(lessons.length-1)}
function delL(i){if(confirm('Delete this lesson?')){lessons.splice(i,1);save();dash()}}
/* ---------- AI ---------- */
async function ai(sys,prompt,web,hist){if(!cfg.ai)throw Error('AI is turned off in Settings');const t=await llm(sys,prompt,web,hist);
const m=t.match(/\{[\s\S]*\}/);try{if(!m)throw 0;return JSON.parse(m[0])}catch{if(hist)return{reply:t||'(no response)',actions:[]};throw Error('AI did not return JSON')}}
const SCHEMA='Respond with ONLY JSON: {"title":string,"items":[{"type":"slide","title":string,"body":string} or {"type":"q","q":string,"opts":[4 strings],"ans":0-3 index}]}.';
async function gen(){const b=$('#gb'),topic=$('#gt').value.trim();if(!topic)return;b.disabled=true;b.textContent='Generating…';
const web=$('#gw').checked,qz=L.quiz,n=$('#gn').value;
try{const j=await ai('You are an expert teacher creating lessons. '+SCHEMA+(qz?' Add a quiz question after every 1-2 slides.':' Use only slide items, no questions.'),
`Create a lesson on: ${topic}. Audience: ${$('#ga').value||'general'}. About ${n} slides.${web?' Search the web for accurate, current facts.':''}`,web);
L.title=j.title||L.title;L.items=(j.items||[]).filter(x=>qz||x.type!=='q');save();edit(cur)}
catch(e){alert('AI error: '+e.message);b.disabled=false;b.textContent='Generate with AI'}}
async function suggest(){const b=$('#sb');b.disabled=true;b.textContent='Reviewing…';
try{const j=await ai('You review lessons and suggest improvements. Respond with ONLY JSON: {"suggestions":[{"index":number,"reason":string,"item":<replacement item, same shape as the original>}]}. Max 5 suggestions.',JSON.stringify({title:L.title,items:L.items}),$('#gw').checked);
aiSugs=j.suggestions||[];edit(cur)}catch(e){alert('AI error: '+e.message);b.disabled=false;b.textContent='✨ Suggest edits'}}
function acc(k){const s=aiSugs[k];if(L.items[s.index])L.items[s.index]=s.item;aiSugs.splice(k,1);save();edit(cur)}
function dis(k){aiSugs.splice(k,1);edit(cur)}
/* ---------- AI chat (plan / agent) ---------- */
let mode=ls('lc_mode','plan');
const setMode=m=>{mode=m;sv('lc_mode',m);edit(cur)};
const fix=x=>{if(!x||typeof x!=='object')return null;
 if(x.type==='q'){if(!L.quiz)return null;const o=(Array.isArray(x.opts)?x.opts:[]).slice(0,4).map(String);while(o.length<4)o.push('');return{type:'q',q:String(x.q||''),opts:o,ans:Math.max(0,Math.min(3,+x.ans||0))}}
 return{type:'slide',title:String(x.title||''),body:String(x.body||'')}};
const nm=x=>x?.title||x?.q||'';
const dsc=a=>a.type==='set_title'?`Rename the lesson to "${a.title}"`:a.type==='add'?`Add a ${a.item?.type==='q'?'question':'slide'} ${a.index?'at position '+a.index:'at the end'}: ${nm(a.item)}`:a.type==='update'?`Update item ${a.index}: ${nm(a.item)}`:a.type==='delete'?`Delete item ${a.index}`:a.type==='write_file'?`Write file ${a.path}`:a.type==='append_file'?`Add to file ${a.path}`:a.type==='delete_file'?`Delete file ${a.path}`:'Unknown step';
function apply(acts){L.undo=JSON.stringify({title:L.title,items:L.items});const done=[];
 for(const a of acts){const i=(+a.index||0)-1;
  if(a.type==='set_title'&&a.title){L.title=String(a.title);done.push(dsc(a))}
  else if(a.type==='add'){const it=fix(a.item);if(!it)continue;const at=a.index?Math.max(0,Math.min(L.items.length,i)):L.items.length;L.items.splice(at,0,it);done.push(dsc(a))}
  else if(a.type==='update'&&L.items[i]){const it=fix(a.item);if(!it)continue;L.items[i]=it;done.push(dsc(a))}
  else if(a.type==='delete'&&L.items[i]){L.items.splice(i,1);done.push(dsc(a))}
  else if(['write_file','append_file','delete_file'].includes(a.type)){if(fileOp(a))done.push(dsc(a))}}
 save();return done}
const steps=l=>`<ol>${l.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`;
function msgsHTML(){const ch=L.chat||[];if(!ch.length)return'<p class="mu">Ask a question, or describe a change like "add a quiz question about the water cycle".</p>';
 return ch.map((m,k)=>m.r==='user'?`<div class="m u">${esc(m.t)}</div>`:`<div class="m a">${esc(m.t)}${m.used?.length?`<div class="mu">${m.used.map(x=>esc(x)).join('; ')}</div>`:''}${m.plan?`<div><b>Plan</b>${steps(m.plan.acts.map(dsc))}${m.plan.done===true?'<span class="mu">Applied</span>':m.plan.done?'<span class="mu">Discarded</span>':`<button class="pri" onclick="doPlan(${k})">Apply plan</button><button class="g" onclick="dropPlan(${k})">Discard</button>`}</div>`:''}${m.did?.length?`<div><b>Changes made</b>${steps(m.did)}</div>`:''}</div>`).join('')}
function chatHTML(){L.chat=L.chat||[];return`<div class="c"><div class="r"><b class="f">AI assistant</b><div class="seg"><button class="${mode==='plan'?'on':''}" onclick="setMode('plan')">Plan</button><button class="${mode==='agent'?'on':''}" onclick="setMode('agent')">Agent</button></div></div>
<p class="mu">${mode==='plan'?'Plan mode: the AI answers and proposes steps. Nothing changes until you press Apply.':'Agent mode: the AI edits the lesson directly. You can undo its last change.'}</p>
<div class="msgs" id="msgs">${msgsHTML()}</div>
<div class="r"><input class="f" id="ci" placeholder="Ask the AI or tell it what to change" onkeydown="if(event.key==='Enter')chat()"><button class="pri" id="cb" onclick="chat()">Send</button></div>
<div class="r"><button class="g" onclick="undo()" ${L.undo?'':'disabled'}>Undo last AI change</button><button class="g" onclick="clr()">Clear history</button></div></div>`}
function msgsView(){const b=$('#msgs');b.innerHTML=msgsHTML();b.scrollTop=b.scrollHeight}
const FALLBACK='You are Lumo, a teaching assistant inside a lesson editor. Help teachers plan lessons, write clear slides and fair four-option quiz questions. Be concise and accurate.';
const saveFs=()=>sv('lc_fs_'+user,fs),np=p=>'/'+String(p||'').replace(/^\/+/,'').slice(0,80);
function loadU(){cfg=ls('lc_set_'+user,{ai:true});fs=ls('lc_fs_'+user,null);role=SRV?SRV.role:scope?.t==='remote'?null:(ls('lc_users',{})[user]||{}).role;SC=role==='principal'&&!SRV?ls('lc_school_'+user,null):null;if(SC)startHub()}
async function skill(){try{const r=await fetch('SKILL.md',{cache:'no-cache'});if(r.ok)return await r.text()}catch{}return FALLBACK}
async function ensureFs(){if(fs)return;fs={'/SKILL.md':await skill(),'/memory.md':'# Memory\n\nNotes the AI keeps about you and your classes.\n'};saveFs()}
async function sysPrompt(){await ensureFs();return`${(fs['/SKILL.md']||FALLBACK).slice(0,7000)}

## Output format (required)
Respond with ONLY JSON: {"reply":string,"actions":[...]}. Use an empty actions array when no action is needed.
Direct lesson edits: {"type":"set_title","title":string}, {"type":"add","index":optional position,"item":ITEM}, {"type":"update","index":number,"item":ITEM}, {"type":"delete","index":number}. ITEM is {"type":"slide","title":string,"body":string} or {"type":"q","q":string,"opts":[4 strings],"ans":0-3}. Item numbers start at 1. Steps run in order, so each index refers to the lesson as it is when that step runs.
Virtual files: {"type":"list_files"}, {"type":"read_file","path":string}, {"type":"write_file","path":string,"content":string}, {"type":"append_file","path":string,"content":string}, {"type":"delete_file","path":string}. Reads run immediately and their results come back to you in the next message; then give your final answer.
Memory: {"type":"remember","text":one short line} saves to /memory.md immediately.
You may use direct lesson edits, virtual files or memory, whichever fits the job.
${L.quiz?'':'Quiz questions are turned off for AI in this lesson, so use slides only. '}${mode==='plan'?'Plan mode: lesson edits and file writes are only a proposal until the teacher approves, so describe the plan in your reply.':'Agent mode: lesson edits and file writes are applied immediately, so say briefly what you changed.'}

## Your memory (/memory.md)
${(fs['/memory.md']||'').slice(-3000)}

## Files

class RConn{constructor(p,peer,cid,open){this.p=p;this.peer=peer;this.cid=cid;this.open=open;this.h={}}
 on(e,f){(this.h[e]=this.h[e]||[]).push(f);return this}emit(e,...a){(this.h[e]||[]).forEach(f=>f(...a))}

 close(){if(this.open){this.open=false;this.p._tx({t:'x',dst:this.peer,cid:this.cid});delete this.p.cs[this.peer+'|'+this.cid];this.emit('close')}}}
class RPeer{constructor(id){this.id=id||null;this.key=crypto.randomUUID();this.h={};this.cs={};this.destroyed=false;this.disconnected=false;this.opened=false;this._open();
  this.iv=setInterval(()=>{if(this.ws&&this.ws.readyState===1)this.ws.send('ping')},25000)}
 on(e,f){(this.h[e]=this.h[e]||[]).push(f);return this}emit(e,...a){(this.h[e]||[]).forEach(f=>f(...a))}
 _tx(m){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(m))}
 _open(){const ws=this.ws=new WebSocket(RELAY.replace(/^http/,'ws').replace(/\/$/,'')+'/ws');let up=false;
  ws.onopen=()=>{up=true;this.disconnected=false;ws.send(JSON.stringify({t:'reg',id:this.id,key:this.key}))};
  ws.onmessage=ev=>{if(ev.data==='pong')return;let m;try{m=JSON.parse(ev.data)}catch{return}
   if(m.t==='open'){this.id=m.id;this.opened=true;this.emit('open',m.id)}
   else if(m.t==='err'){this.emit('error',{type:m.e,dst:m.dst})}
   else if(m.t==='c'){const c=new RConn(this,m.src,m.cid,true);this.cs[m.src+'|'+m.cid]=c;this._tx({t:'ca',dst:m.src,cid:m.cid});this.emit('connection',c)}
   else if(m.t==='gone'){for(const k in this.cs){const c=this.cs[k];if(c.peer===m.id){c.open=false;delete this.cs[k];c.emit('close')}}}
   else{const k=m.src+'|'+m.cid,c=this.cs[k];if(!c)return;if(m.t==='ca'){c.open=true;c.emit('open')}else if(m.t==='d')c.emit('data',m.m);else if(m.t==='x'){c.open=false;delete this.cs[k];c.emit('close')}}};
  ws.onclose=()=>{if(this.ws!==ws||this.destroyed)return;if(!up&&!this.opened)this.emit('error',{type:'network'});this.disconnected=true;Object.values(this.cs).forEach(c=>{c.open=false;c.emit('close')});this.cs={};this.emit('disconnected')}}
 connect(id){const c=new RConn(this,id,crypto.randomUUID().slice(0,8),false);this.cs[id+'|'+c.cid]=c;this._tx({t:'c',dst:id,cid:c.cid});return c}
 reconnect(){if(!this.destroyed&&this.disconnected)this._open()}
 destroy(){this.destroyed=true;clearInterval(this.iv);try{this.ws.close()}catch{}}}

 push(id){const c=this.cn[id],p=this.pl[id],x=this.items[this.idx];if(!c||!p)return;c.send({t:'st',title:this.l.title,idx:this.idx,total:this.items.length,item:x&&(x.type==='q'?{type:'q',q:x.q,opts:x.opts}:x),reveal:this.reveal,ans:this.reveal?x?.ans:null,mine:p.ans,score:p.score,lb:this.lb?this.board().slice(0,5):null})}

 try{const j=await api('GET','/api/schools?q='+encodeURIComponent($('#sq').value.trim()));
  o.innerHTML=(j.schools||[]).filter(x=>/^[A-Z0-9]{6}$/.test(x.id)).map(x=>`<div class="tr"><div class="f"><b>${esc(x.name)}</b><div class="mu">${esc(x.city||'')}</div></div><button class="pri" onclick="$('#ssc').value='${x.id}';$('#su2').focus()">Select</button></div>`).join('')||'<p class="mu">No schools found. Ask your principal for the school code.</p>'}
 catch(e){o.textContent=e.message}}
async function sLogin(){const e=$('#se');e.textContent='';try{srvSet(await api('POST','/api/login',{school:$('#ssc').value.trim(),u:$('#su2').value.trim(),p:$('#sp2').value}));dash()}catch(x){e.textContent=x.message}}
async function sJoin(){const e=$('#se');e.textContent='';try{const j=await api('POST','/api/join',{school:$('#ssc').value.trim(),u:$('#su2').value.trim(),p:$('#sp2').value});e.textContent=j.msg}catch(x){e.textContent=x.message}}
async function sCreate(){const e=$('#pe');e.textContent='';try{srvSet(await api('POST','/api/school/create',{name:$('#psn').value,city:$('#psc').value,u:$('#pu').value,p:$('#pp').value}));dash()}catch(x){e.textContent=x.message}}
async function connCheckSrv(){const o=$('#cc'),L=[],add=t=>{L.push(t);o.innerHTML=L.map(x=>`<div>${esc(x)}</div>`).join('')};add('Connection service: Lumo server.');
 try{await api('GET','/api/ping');add('Server reachable.')}catch(e){add('Problem: '+e.message);return}
 try{await api('GET','/api/school/info?id=AAAAAA');add('Database connected.')}catch(e){add(/No school/.test(e.message)?'Database connected. Joining should work from this device.':'Problem: '+e.message)}}
/* students */
async function sJoinPlay(){const code=$('#jc').value.toUpperCase().replace(/[^A-Z0-9]/g,''),name=$('#jn').value.trim(),e=$('#je');
 if(!code||!name){e.textContent='Enter the code and your name.';return}e.textContent='Connecting…';
 try{const j=await api('POST','/api/play/join',{code,name}),S=srvStu={code,pid:j.pid,ver:j.state.ver};
  conn={send:m=>{if(m.t==='ans')api('POST','/api/play/answer',{code,pid:S.pid,a:m.a}).then(s=>{S.ver=s.ver;sview(s)}).catch(x=>hint(x.message));else if(m.t==='sug')api('POST','/api/play/suggest',{code,pid:S.pid,x:m.x}).catch(()=>{})}};
  sview(j.state);stuLoop(S)}catch(x){e.textContent=x.message}}
async function stuLoop(S){while(srvStu===S){try{const r=await api('GET',`/api/play/state?code=${S.code}&pid=${S.pid}&since=${S.ver}`);if(srvStu!==S)return;
  if(r.ended){srvStu=null;app.innerHTML='<div class="c"><h2>Lesson ended</h2><button onclick="location.reload()">Back</button></div>';return}
  if(!r.same){S.ver=r.ver;sview(r)}}catch(e){await sleep(2500)}}}
/* hosting */
async function sHost(i){const l=lessons[i];hosting=true;app.innerHTML='<div class="c">Starting the lesson…</div>';
 try{const j=await api('POST','/api/host',{lesson:l}),H0=srvHost={code:j.code,hk:j.hk,ver:-1,S:null};hostLoop(H0)}
 catch(e){hosting=false;app.innerHTML=`<div class="c"><p>${esc(e.message)}</p><button onclick="endHost()">Back</button></div>`}}
async function hostLoop(H0){while(srvHost===H0){try{const r=await api('GET',`/api/host/state?code=${H0.code}&hk=${H0.hk}&since=${H0.ver}`);if(srvHost!==H0)return;
  if(r.ended){srvHost=null;hosting=false;present(false);alert('This lesson has ended.');scope?.t==='smgr'?schoolView():dash();return}
  if(!r.same){H0.ver=r.ver;H0.S=r;hview(r)}}catch(e){if(srvHost!==H0)return;if(H0.S)hview({...H0.S,err:e.message});await sleep(3000)}}}
async function sCmd(a,v){const H0=srvHost;if(!H0)return;try{const r=await api('POST','/api/host/cmd',{code:H0.code,hk:H0.hk,a,v});if(r.ended||srvHost!==H0)return;H0.ver=r.ver;H0.S=r;hview(r)}catch(e){hint(e.message)}}
/* principal */
async function schoolViewSrv(quiet){scope={t:'srv'};hdr();if(!quiet)app.innerHTML='<div class="c mu">Loading…</div>';
 let A;try{A=await api('GET','/api/admin')}catch(e){app.innerHTML=`<div class="c"><p>${esc(e.message)}</p><button onclick="dash()">Back</button></div>`;return}
 SA=A;lessons=A.mine;const s=A.school,a=s.ai,ms=A.members,pend=ms.filter(m=>m.st==='pending'),ok=ms.filter(m=>m.st!=='pending');
 app.innerHTML=`<div class="c" id="schoolview"><div class="r"><button class="g" onclick="dash()">← Back</button><h2 class="f">${esc(s.name)}</h2></div>
<div class="mu">School code (give this to teachers)</div><div class="code" style="color:var(--board)">${esc(s.id)}</div>
<p class="mu">Teachers, lessons and live lessons are stored on the Lumo server, so no computer needs to stay on.</p>
<label class="t"><input type="checkbox" ${s.listed?'checked':''} onchange="sList(this.checked)">Show in school search</label></div>
<div class="c"><b>School AI</b><p class="mu">Set one API key for the whole school. It stays on the server, and teachers never see it.</p>
<label class="t"><input type="checkbox" id="sai_on" ${a.on?'checked':''}>Let teachers use the school AI</label>
<label class="fld">Provider<select onchange="sAiProv(this.value)">${Object.entries(PROV).map(([k,v])=>`<option value="${k}" ${k===a.prov?'selected':''}>${v.n}</option>`).join('')}</select></label>
${a.prov==='builtin'?'<p class="mu">Uses the shared proxy.</p>':`<label class="fld">API key<input type="password" id="sai_k" autocomplete="off" placeholder="${a.has[a.prov]?'A key is saved. Paste a new one to replace it.':'Paste your API key'}"></label><label class="fld">Model<input id="sai_m" value="${esc(a.model)}"></label>`}
<label class="fld">Daily limit per teacher<input type="number" id="sai_c" min="1" value="${a.cap}"></label>
<button class="pri" onclick="sAiSave()">Save</button><button class="g" onclick="sAiTest()">Test</button><p class="mu" id="schmsg"></p></div>
<div class="c"><b>Join requests</b>${pend.map(m=>`<div class="tr"><b class="f">${esc(m.u)}</b><button class="pri" onclick="sMem(${ms.indexOf(m)},'ok')">Accept</button><button class="d" onclick="sMem(${ms.indexOf(m)},'deny')">Decline</button></div>`).join('')||'<p class="mu">No requests waiting.</p>'}</div>
<div class="c"><b>Teachers</b>${ok.map(m=>{const k=ms.indexOf(m);return`<div class="tr"><div class="f"><b>${esc(m.u)}</b> <span class="badge">${m.st==='off'?'Suspended':'Active'}</span><div class="mu">${m.n} lessons</div></div><button class="g" onclick="sMem(${k},'${m.st==='off'?'on':'off'}')">${m.st==='off'?'Reinstate':'Suspend'}</button><button class="g" onclick="sMem(${k},'pw')">Reset password</button><button class="d" onclick="sMem(${k},'rm')">Remove</button></div>`}).join('')||'<p class="mu">No teachers yet.</p>'}</div>
<div class="c"><b>All lessons</b>${ok.map(m=>{const k=ms.indexOf(m);return(A.lessons[m.u]||[]).map((l,j)=>`<div class="tr"><div class="f"><b>${esc(l.title)}</b><div class="mu">${esc(m.u)}, ${l.n} items</div></div><button class="g" onclick="sLes(${k},${j},'edit')">Edit</button><button class="pri" onclick="sLes(${k},${j},'host')">Host</button><button class="d" onclick="sLes(${k},${j},'del')">Delete</button></div>`).join('')}).join('')||'<p class="mu">No lessons yet.</p>'}</div>
<div class="c"><b>Live now</b>${A.live.map((x,k)=>`<div class="tr"><div class="f"><b>${esc(x.title)}</b><div class="mu">${esc(x.owner||'')}, code ${esc(x.code)}, ${x.n} students</div></div><button class="d" onclick="sEnd(${k})">End</button></div>`).join('')||'<p class="mu">No live lessons.</p>'}</div>`;
 clearInterval(saTimer);saTimer=setInterval(()=>{if(!$('#schoolview')){clearInterval(saTimer);return}if(!/INPUT|SELECT/.test(document.activeElement?.tagName))schoolViewSrv(true)},10000)}
async function sMem(k,a){const m=SA.members[k];if(!m)return;let pw;
 if(a==='rm'&&!confirm('Remove '+m.u+' and delete their lessons?'))return;
 if(a==='pw'){pw=prompt('New password for '+m.u+' (6+ characters)');if(!pw)return}
 try{await api('POST','/api/admin/member',{u:m.u,a,pw})}catch(e){alert(e.message)}schoolViewSrv()}
async function sLes(k,j,a){const m=SA.members[k];if(!m)return;
 try{const r=await api('GET','/api/admin/lessons?u='+encodeURIComponent(m.u));
  if(a==='del'){if(!confirm('Delete this lesson?'))return;r.lessons.splice(j,1);await api('PUT','/api/admin/lessons?u='+encodeURIComponent(m.u),{lessons:r.lessons});schoolViewSrv();return}
  scope={t:'smgr',u:m.u};lessons=r.lessons;a==='edit'?edit(j):host(j)}catch(e){alert(e.message)}}
async function sEnd(k){const x=SA.live[k];if(!x)return;try{await api('POST','/api/admin/end',{code:x.code})}catch(e){alert(e.message)}schoolViewSrv()}
async function sList(on){try{await api('POST','/api/admin/list',{listed:on})}catch(e){alert(e.message)}schoolViewSrv()}
async function sAiProv(v){try{await api('POST','/api/admin/ai',{prov:v})}catch(e){alert(e.message)}schoolViewSrv()}
async function sAiSave(){const m=$('#schmsg'),b={on:$('#sai_on').checked,cap:+$('#sai_c').value||200};if($('#sai_m'))b.model=$('#sai_m').value;if($('#sai_k')&&$('#sai_k').value.trim())b.key=$('#sai_k').value;
 try{await api('POST','/api/admin/ai',b);SRV.school.ai=b.on;sv('lc_srv',SRV);if($('#sai_k'))$('#sai_k').value='';m.textContent='Saved.'}catch(e){m.textContent='Could not save: '+e.message}}
async function sAiTest(){const m=$('#schmsg');m.textContent='Testing…';try{const r=await api('POST','/api/ai',{sys:'Reply with the single word: ok',p:'ping',h:[]});m.textContent='Connected. The model replied: '+String(r.text).slice(0,60)}catch(e){m.textContent='Failed: '+e.message}}
/* ---------- presenting ---------- */
let hosting=false;
function hint(t){document.querySelector('.hint')?.remove();const d=document.createElement('div');d.className='hint';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),700)},4500)}
function present(on){document.body.classList.toggle('present',on);if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(on)hint('Space or → next · ← back · R reveal answer · F or Esc to exit')}
function toggleFull(){const on=!document.body.classList.contains('present');present(on);if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present')});
document.addEventListener('keydown',e=>{if(!hosting||e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;const k=e.key;
 if(k===' '||k==='ArrowRight'||k==='PageDown')go(1);else if(k==='ArrowLeft'||k==='PageUp')go(-1);else if(k==='r'||k==='R')rev();else if(k==='f'||k==='F')toggleFull();else if(k==='Escape'&&document.body.classList.contains('present'))present(false);else return;
 e.preventDefault();if(document.activeElement?.tagName==='BUTTON')document.activeElement.blur()});
/* ---------- student ---------- */
function join(){if(WORKER)return sJoinPlay();const code=$('#jc').value.toUpperCase().replace(/[^A-Z0-9]/g,''),name=$('#jn').value.trim(),e=$('#je');
if(!code||!name){e.textContent='Enter the code and your name.';return}e.textContent='Connecting…';
const fail=t=>{e.textContent=t};try{peer&&peer.destroy()}catch{}
peer=new Peer();peer.on('open',()=>{conn=peer.connect('hrslesson-'+code,{reliable:true});
 conn.on('open',()=>conn.send({t:'join',name}));conn.on('data',m=>{if(m.t==='st')sview(m)});
 conn.on('close',()=>{app.innerHTML='<div class="c"><h2>Lesson ended</h2><button onclick="location.reload()">Back</button></div>'});
 setTimeout(()=>{if(!conn.open)fail('Still not connected. Check the code, make sure your teacher has started the lesson, or try another network.')},12000)});
peer.on('error',er=>fail(er.type==='peer-unavailable'?'No lesson with that code is running. Check the code, and make sure your teacher has started hosting.':['network','server-error','socket-error','socket-closed','webrtc'].includes(er.type)?'Cannot reach the connection service. Check your internet or try another network.':'Could not connect ('+er.type+').'))}
function sview(m){document.body.dataset.m='stage';const x=m.item;let h=`<div class="bar"><b class="f">${esc(m.title)}</b><span class="pts">${m.score} pts</span></div><div class="prog"><i style="width:${(m.idx+1)/Math.max(1,m.total)*100}%"></i></div><div class="board big">`;
if(!x)h+='<p>Waiting for your teacher to start.</p>';
else if(x.type==='q')h+=`<h2>${esc(x.q)}</h2>`+x.opts.map((o,k)=>`<button class="opt ${m.reveal?(k===m.ans?'ok':k===m.mine?'no':''):(k===m.mine?'sel':'')}" ${m.mine!==null||m.reveal?'disabled':''} onclick="conn.send({t:'ans',a:${k}})"><b class="ab">${'ABCD'[k]}</b>${esc(o)}</button>`).join('')+(m.reveal?`<p class="res">${m.mine===m.ans?'Correct, +100 points':'Not quite. The right answer is highlighted.'}</p>`:m.mine!==null?'<p class="mu">Answer locked in…</p>':'');
else h+=`<h2>${esc(x.title)}</h2><p>${esc(x.body)}</p>`;
h+='</div>';
if(m.lb)h+=`<div class="lb"><b>Leaderboard</b>${m.lb.map((p,i)=>`<div class="rk"><span>${i+1}. ${esc(p.n)}</span><b>${p.s}</b></div>`).join('')}</div>`;
h+=`<div class="lb"><input id="sx" placeholder="Suggest an edit or improvement to your teacher"><button class="g" onclick="const v=$('#sx').value.trim();if(v){conn.send({t:'sug',x:v});$('#sx').value='';this.textContent='Sent ✓'}">Send suggestion</button></div>`;
const f=document.activeElement?.id==='sx'?$('#sx').value:'';app.innerHTML=h;if(f){$('#sx').value=f;$('#sx').focus()}}
home();
</script></body></html>
